<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Photo Curator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f4f0;
      --card: #ffffff;
      --text: #1e1b17;
      --text-light: #8a8075;
      --border: #e8e3db;
      --keep: #2d6a4f;
      --delete: #b83232;
      --keep-bg: rgba(45, 106, 79, 0.88);
      --delete-bg: rgba(184, 50, 50, 0.88);
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.11), 0 2px 4px rgba(0,0,0,0.06);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      position: fixed;
      inset: 0;
    }
    .screen.active { display: flex; }

    /* ── LANDING ── */
    #screen-landing {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 32px 28px;
      padding-top: calc(32px + var(--safe-top));
      padding-bottom: calc(32px + var(--safe-bottom));
    }

    .landing-icon-wrap {
      width: 84px;
      height: 84px;
      background: var(--text);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
    }
    .landing-icon-wrap svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .landing-title {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      text-align: center;
    }

    .landing-sub {
      font-size: 15px;
      color: var(--text-light);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .landing-last {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 300px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 14px 10px 10px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .landing-last-thumb {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
    }
    .landing-last-info { flex: 1; min-width: 0; }
    .landing-last-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-light);
      margin-bottom: 3px;
    }
    .landing-last-date {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .btn-primary {
      width: 100%;
      max-width: 300px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 17px 40px;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
      min-height: 56px;
      box-shadow: var(--shadow-md);
    }
    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary.loading { opacity: 0.75; cursor: default; display: flex; align-items: center; justify-content: center; gap: 10px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(247,244,240,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loading-overlay.active { display: flex; }
    .loading-spinner-lg {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(30,27,23,0.12);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .loading-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-light);
    }

    #file-input { display: none; }

    /* ── SWIPER ── */
    #screen-swiper {
      background: #0a0a0a;
      flex-direction: column;
      overflow: hidden;
    }

    #swiper-progress {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.1);
      z-index: 30;
    }
    #swiper-progress-fill {
      height: 100%;
      background: rgba(255,255,255,0.65);
      transition: width 0.3s ease;
    }

    #swiper-counter {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0,0,0,0.48);
      color: rgba(255,255,255,0.88);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    #btn-stop {
      position: absolute;
      top: calc(12px + var(--safe-top));
      right: 16px;
      z-index: 40;
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      min-height: 40px;
      letter-spacing: 0.01em;
    }
    #btn-stop:active { opacity: 0.65; }

    #btn-undo {
      position: absolute;
      bottom: calc(20px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: none;
      min-height: 40px;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    #btn-undo:active { opacity: 0.65; }

    #photo-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      transition: none;
    }
    #photo-container.animating {
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.28s ease;
    }

    #photo-img {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      pointer-events: none;
      user-select: none;
    }

    #decision-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.08s;
    }
    #decision-overlay.keep   { background: linear-gradient(120deg, rgba(45,106,79,0.55), rgba(45,106,79,0.18)); opacity: 1; }
    #decision-overlay.delete { background: linear-gradient(240deg, rgba(184,50,50,0.55), rgba(184,50,50,0.18)); opacity: 1; }

    #decision-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 15;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #fff;
      pointer-events: none;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #decision-icon.show { transform: translate(-50%, -50%) scale(1); }
    #decision-icon[data-action="keep"]   { background: var(--keep-bg);   backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    #decision-icon[data-action="delete"] { background: var(--delete-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

    /* hints */
    .hint {
      position: absolute;
      bottom: calc(50px + var(--safe-bottom));
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      opacity: 0.72;
    }
    #hint-left  { left: 18px; align-items: flex-start; }
    #hint-right { right: 18px; align-items: flex-end; }
    .hint-arrow {
      font-size: 22px;
      color: #fff;
      line-height: 1;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.55));
    }
    .hint-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 4px rgba(0,0,0,0.65);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── CONFIRM ── */
    #screen-confirm {
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(28px + var(--safe-top)) 20px calc(32px + var(--safe-bottom));
    }

    .confirm-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .confirm-icon { font-size: 40px; margin-bottom: 10px; }
    .confirm-title {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      font-weight: 600;
    }

    /* stats row */
    .confirm-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-tile {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-tile.stat-delete-tile {
      border-color: rgba(184,50,50,0.22);
      background: rgba(184,50,50,0.04);
    }
    .stat-num {
      display: block;
      font-family: 'Fraunces', serif;
      font-size: 30px;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-tile.stat-delete-tile .stat-num { color: var(--delete); }
    .stat-tile:not(.stat-delete-tile) .stat-num { color: var(--keep); }
    .stat-label-sm {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* thumb grid */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-bottom: 20px;
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .thumb-item {
      position: relative;
      aspect-ratio: 1;
      background: var(--border);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 20px;
      height: 20px;
      background: var(--delete);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* actions */
    .confirm-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-danger {
      background: var(--delete);
      color: #fff;
      border: none;
      border-radius: var(--radius-lg);
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 17px 24px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      min-height: 56px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(184,50,50,0.28);
    }
    .btn-danger:active { transform: scale(0.98); opacity: 0.9; }

    .actions-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .btn-ghost {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--text);
      border: none;
      border-top: 1px solid var(--border);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 15px 16px;
      cursor: pointer;
      text-align: center;
    }
    .btn-ghost:first-child { border-top: none; }
    .btn-ghost:active { background: var(--bg); }

    .btn-debug {
      background: transparent;
      color: var(--text-light);
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
    }
    .btn-debug:active { opacity: 0.6; }

    pre#debug-string {
      font-size: 11px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      word-break: break-all;
      white-space: pre-wrap;
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-light);
      font-size: 15px;
    }
  </style>
</head>
<body>

<!-- LANDING -->
<div id="screen-landing" class="screen active">
  <div class="landing-icon-wrap">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </div>
  <h1 class="landing-title">Photo Curator</h1>
  <p class="landing-sub">Swipe left to delete, right to keep. Clean up your camera roll in seconds.</p>
  <div class="landing-last" id="landing-last" style="display:none">
    <img class="landing-last-thumb" id="landing-last-thumb" src="" alt="">
    <div class="landing-last-info">
      <div class="landing-last-label">Last session</div>
      <div class="landing-last-date" id="landing-last-date"></div>
    </div>
  </div>
  <button class="btn-primary" id="btn-select">Select Photos</button>
  <input type="file" id="file-input" accept="image/*" multiple>
</div>

<!-- LOADING OVERLAY -->
<div id="loading-overlay">
  <div class="loading-spinner-lg"></div>
  <div class="loading-label" id="loading-label">Loading photos…</div>
</div>

<!-- SWIPER -->
<div id="screen-swiper" class="screen">
  <div id="swiper-progress"><div id="swiper-progress-fill"></div></div>
  <div id="swiper-counter">1 / 1</div>
  <button id="btn-stop" aria-label="Stop swiping">Done</button>
  <button id="btn-undo" aria-label="Undo">↩ Undo</button>

  <div id="photo-container">
    <img id="photo-img" src="" alt="">
    <div id="decision-overlay"></div>
    <div id="decision-icon"></div>
  </div>

  <div class="hint" id="hint-left">
    <span class="hint-arrow">←</span>
    <span class="hint-label">Delete</span>
  </div>
  <div class="hint" id="hint-right">
    <span class="hint-arrow">→</span>
    <span class="hint-label">Keep</span>
  </div>
</div>

<!-- CONFIRM -->
<div id="screen-confirm" class="screen">
  <div class="confirm-header">
    <div class="confirm-icon">🗑️</div>
    <h2 class="confirm-title" id="confirm-title">Review</h2>
  </div>

  <div class="confirm-stats" id="confirm-stats">
    <div class="stat-tile">
      <span class="stat-num" id="stat-kept">0</span>
      <span class="stat-label-sm">kept</span>
    </div>
    <div class="stat-tile stat-delete-tile">
      <span class="stat-num" id="stat-del">0</span>
      <span class="stat-label-sm">to delete</span>
    </div>
  </div>

  <div class="thumb-grid" id="thumb-grid"></div>

  <div class="confirm-actions">
    <button class="btn-danger" id="btn-delete">Delete</button>
    <div class="actions-secondary">
      <button class="btn-ghost" id="btn-reswipe">Restart swiping</button>
      <button class="btn-ghost" id="btn-restart">Select new photos</button>
    </div>
    <button class="btn-debug" id="btn-copy">Copy input string</button>
    <pre id="debug-string" style="display:none"></pre>
  </div>
</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────
let photos = [];   // { file, url, name, date, decision }
let index = 0;
let hintsShown = false;

// ── Last session reminder ───────────────────────────────
(function() {
  const raw = localStorage.getItem('lastSwipe');
  if (!raw) return;
  try {
    const { thumbnail, photoDate } = JSON.parse(raw);
    if (!thumbnail || !photoDate) return;
    document.getElementById('landing-last-thumb').src = thumbnail;
    document.getElementById('landing-last-date').textContent = photoDate;
    document.getElementById('landing-last').style.display = '';
  } catch(_) {}
})();

// ── Elements ───────────────────────────────────────────
const screens = {
  landing: document.getElementById('screen-landing'),
  swiper:  document.getElementById('screen-swiper'),
  confirm: document.getElementById('screen-confirm'),
};

const fileInput        = document.getElementById('file-input');
const btnSelect        = document.getElementById('btn-select');
const photoContainer   = document.getElementById('photo-container');
const photoImg         = document.getElementById('photo-img');
const decisionOverlay  = document.getElementById('decision-overlay');
const decisionIcon     = document.getElementById('decision-icon');
const swiperCounter    = document.getElementById('swiper-counter');
const progressFill     = document.getElementById('swiper-progress-fill');
const hintLeft         = document.getElementById('hint-left');
const hintRight        = document.getElementById('hint-right');
const confirmTitle     = document.getElementById('confirm-title');
const thumbGrid        = document.getElementById('thumb-grid');
const btnDelete        = document.getElementById('btn-delete');
const btnRestart       = document.getElementById('btn-restart');

// ── Screen helpers ──────────────────────────────────────
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  document.body.style.overflow = name === 'swiper' ? 'hidden' : '';
}

// ── EXIF / date ─────────────────────────────────────────
function formatDate(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  const yyyy = dt.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

async function getPhotoDate(file) {
  try {
    if (typeof exifr !== 'undefined') {
      const exif = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
      const raw = exif?.DateTimeOriginal ?? exif?.CreateDate;
      if (raw) return formatDate(raw);
    }
  } catch (_) {}
  return formatDate(new Date(file.lastModified));
}

// ── File loading ────────────────────────────────────────
btnSelect.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files);
  if (!files.length) return;

  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingLabel   = document.getElementById('loading-label');

  btnSelect.innerHTML = '<span class="spinner"></span>Loading…';
  btnSelect.classList.add('loading');
  btnSelect.disabled = true;
  loadingOverlay.classList.add('active');
  loadingLabel.textContent = `Loading ${files.length} photo${files.length !== 1 ? 's' : ''}…`;

  photos.forEach(p => URL.revokeObjectURL(p.url));

  photos = await Promise.all(files.map(async (file) => ({
    file,
    url:  URL.createObjectURL(file),
    name: file.name.replace(/\.[^.]+$/, ''),
    date: await getPhotoDate(file),
    decision: null,
  })));

  photos.sort((a, b) => {
    const parse = d => { const [dd,mm,yyyy] = d.split('/'); return new Date(yyyy, mm-1, dd); };
    return parse(a.date) - parse(b.date);
  });

  loadingOverlay.classList.remove('active');
  btnSelect.innerHTML = 'Select Photos';
  btnSelect.classList.remove('loading');
  btnSelect.disabled = false;
  fileInput.value = '';

  index = 0;
  hintsShown = false;
  showScreen('swiper');
  loadPhoto(index);
  showHints();
});

// ── Swiper ──────────────────────────────────────────────
const btnUndo = document.getElementById('btn-undo');

function loadPhoto(i) {
  const p = photos[i];
  photoImg.src = p.url;
  photoContainer.style.transform = '';
  photoContainer.style.opacity = '';
  decisionOverlay.className = '';
  decisionIcon.className = '';
  decisionIcon.textContent = '';
  delete decisionIcon.dataset.action;
  swiperCounter.textContent = `${i + 1} / ${photos.length}`;
  progressFill.style.width = `${(i + 1) / photos.length * 100}%`;
  btnUndo.style.display = i > 0 ? 'block' : 'none';
}

function undo() {
  if (index === 0) return;
  index--;
  photos[index].decision = null;
  photoContainer.classList.remove('animating');
  loadPhoto(index);
}

function todayFormatted() {
  const now = new Date();
  const dd = String(now.getDate()).padStart(2, '0');
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const yyyy = now.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function saveThumbnail(imgEl, photoDate) {
  try {
    const size = 80;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const min = Math.min(imgEl.naturalWidth, imgEl.naturalHeight);
    const sx = (imgEl.naturalWidth - min) / 2;
    const sy = (imgEl.naturalHeight - min) / 2;
    ctx.drawImage(imgEl, sx, sy, min, min, 0, 0, size, size);
    const thumbnail = canvas.toDataURL('image/jpeg', 0.65);
    localStorage.setItem('lastSwipe', JSON.stringify({ thumbnail, photoDate }));
  } catch(_) {}
}

function decide(action) {
  photos[index].decision = action;
  saveThumbnail(photoImg, photos[index].date);

  decisionOverlay.className = action;
  decisionIcon.dataset.action = action;
  decisionIcon.textContent = action === 'keep' ? '✓' : '✕';
  decisionIcon.classList.add('show');

  const dir = action === 'keep' ? -1 : 1;
  photoContainer.classList.add('animating');
  photoContainer.style.transform = `translateX(${dir * 110}vw)`;
  photoContainer.style.opacity = '0';

  setTimeout(() => {
    photoContainer.classList.remove('animating');
    index++;
    if (index < photos.length) {
      loadPhoto(index);
    } else {
      showConfirm();
    }
  }, 290);
}

// ── Touch / swipe ────────────────────────────────────────
let touchStartX = 0;
let touchStartY = 0;
let dragging = false;

document.getElementById('screen-swiper').addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  dragging = false;
}, { passive: true });

document.getElementById('screen-swiper').addEventListener('touchmove', (e) => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!dragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
    dragging = true;
  }
  if (dragging) {
    photoContainer.style.transform = `translateX(${dx}px) rotate(${dx * 0.02}deg)`;
    const ratio = Math.min(Math.abs(dx) / 80, 1);
    const action = dx < 0 ? 'delete' : 'keep';
    decisionOverlay.className = action;
    decisionOverlay.style.opacity = String(ratio * 0.8);
    decisionIcon.dataset.action = action;
    decisionIcon.textContent = dx < 0 ? '✕' : '✓';
    if (ratio > 0.4) {
      decisionIcon.classList.add('show');
    } else {
      decisionIcon.classList.remove('show');
    }
  }
}, { passive: true });

document.getElementById('screen-swiper').addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;

  if (dragging && Math.abs(dx) > 50) {
    decisionOverlay.style.opacity = '';
    if (dx < 0) decide('delete');
    else decide('keep');
    return;
  }

  if (dragging) {
    photoContainer.classList.add('animating');
    photoContainer.style.transform = '';
    photoContainer.style.opacity = '';
    decisionOverlay.className = '';
    decisionOverlay.style.opacity = '';
    decisionIcon.className = '';
    delete decisionIcon.dataset.action;
    setTimeout(() => photoContainer.classList.remove('animating'), 290);
  }
}, { passive: true });

// ── Keyboard (desktop testing) ─────────────────────────
document.addEventListener('keydown', (e) => {
  if (!screens.swiper.classList.contains('active')) return;
  if (e.key === 'ArrowLeft')  decide('delete');
  if (e.key === 'ArrowRight') decide('keep');
  if (e.key === 'Backspace' || e.key === 'z') undo();
});

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-stop').addEventListener('click', showConfirm);

// ── Hint arrows ─────────────────────────────────────────
function showHints() {
  hintLeft.classList.add('visible');
  hintRight.classList.add('visible');
}

// ── Confirm screen ──────────────────────────────────────
function showConfirm() {
  showScreen('confirm');

  const toDelete = photos.filter(p => p.decision === 'delete');
  const kept = photos.length - toDelete.length;

  confirmTitle.textContent = `Delete ${toDelete.length} photo${toDelete.length !== 1 ? 's' : ''}?`;
  document.getElementById('stat-kept').textContent = kept;
  document.getElementById('stat-del').textContent  = toDelete.length;

  thumbGrid.innerHTML = '';
  if (toDelete.length === 0) {
    thumbGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No photos marked for deletion 🎉</div>';
    btnDelete.style.display = 'none';
  } else {
    btnDelete.style.display = '';
    toDelete.forEach(p => {
      const div = document.createElement('div');
      div.className = 'thumb-item';
      const img = document.createElement('img');
      img.src = p.url;
      img.alt = p.name;
      const badge = document.createElement('div');
      badge.className = 'thumb-badge';
      badge.textContent = '✕';
      div.appendChild(img);
      div.appendChild(badge);
      thumbGrid.appendChild(div);
    });
  }
}

// ── Delete via Shortcuts ────────────────────────────────
function buildInput() {
  return photos.filter(p => p.decision === 'delete').map(p => `${p.name}|${p.date}`).join(',');
}

btnDelete.addEventListener('click', () => {
  const input = buildInput();
  if (!input) return;
  const url = 'shortcuts://run-shortcut?name=Delete%20Photos%20From%20Text&input=' + encodeURIComponent(input);
  window.location.href = url;
});

const btnCopy = document.getElementById('btn-copy');
const debugString = document.getElementById('debug-string');
btnCopy.addEventListener('click', () => {
  const input = buildInput();
  debugString.textContent = input;
  debugString.style.display = 'block';
  navigator.clipboard.writeText(input).then(() => {
    btnCopy.textContent = 'Copied!';
    setTimeout(() => { btnCopy.textContent = 'Copy input string'; }, 2000);
  }).catch(() => {
    btnCopy.textContent = 'See string below';
  });
});

// ── Restart swiping (same photos, reset decisions) ──────
document.getElementById('btn-reswipe').addEventListener('click', () => {
  photos.forEach(p => { p.decision = null; });
  index = 0;
  showScreen('swiper');
  loadPhoto(0);
  showHints();
});

// ── Select new photos ────────────────────────────────────
btnRestart.addEventListener('click', () => {
  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  index = 0;
  showScreen('landing');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/photo-curator/sw.js');
}
</script>
