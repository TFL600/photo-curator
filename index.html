<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Photo Curator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --text: #33302a;
      --text-light: #8a8580;
      --border: #e7e3de;
      --keep: #2d6a4f;
      --delete: #c0392b;
      --keep-light: #d4edda;
      --delete-light: #fde8e8;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      position: fixed;
      inset: 0;
    }
    .screen.active { display: flex; }

    /* ── LANDING ── */
    #screen-landing {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
      padding-top: calc(24px + var(--safe-top));
      padding-bottom: calc(24px + var(--safe-bottom));
    }

    .landing-icon {
      font-size: 64px;
      margin-bottom: 24px;
      line-height: 1;
    }

    .landing-title {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }

    .landing-sub {
      font-size: 15px;
      color: var(--text-light);
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 48px;
    }

    .btn-primary {
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 16px 40px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      min-height: 54px;
    }
    .btn-primary:active { transform: scale(0.97); opacity: 0.85; }

    #file-input { display: none; }

    /* ── SWIPER ── */
    #screen-swiper {
      background: #000;
      flex-direction: column;
      overflow: hidden;
    }

    #swiper-counter {
      position: absolute;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
      pointer-events: none;
    }

    #photo-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      transition: none;
    }

    #photo-container.animating {
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.28s ease;
    }

    #photo-img {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      pointer-events: none;
      user-select: none;
    }

    /* decision overlay tint */
    #decision-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.1s;
    }
    #decision-overlay.keep { background: rgba(45, 106, 79, 0.35); opacity: 1; }
    #decision-overlay.delete { background: rgba(192, 57, 43, 0.35); opacity: 1; }

    /* decision icon */
    #decision-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 15;
      font-size: 80px;
      pointer-events: none;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #decision-icon.show { transform: translate(-50%, -50%) scale(1); }

    /* tap zones */
    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35%;
      z-index: 30;
      opacity: 0;
    }
    #tap-left { left: 0; }
    #tap-right { right: 0; }

    /* hint arrows */
    .hint {
      position: absolute;
      bottom: calc(48px + var(--safe-bottom));
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .hint.visible { opacity: 1; }
    #hint-left { left: 20px; }
    #hint-right { right: 20px; }

    .hint-icon {
      font-size: 26px;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7));
    }
    .hint-label {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── CONFIRM ── */
    #screen-confirm {
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
    }

    .confirm-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .confirm-icon { font-size: 48px; margin-bottom: 12px; }

    .confirm-title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .confirm-sub {
      font-size: 14px;
      color: var(--text-light);
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 32px;
    }

    .thumb-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--border);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .confirm-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-danger {
      background: var(--delete);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 16px 24px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      min-height: 54px;
      text-align: center;
    }
    .btn-danger:active { transform: scale(0.97); opacity: 0.85; }

    .btn-ghost {
      background: transparent;
      color: var(--text-light);
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      padding: 12px;
      cursor: pointer;
      text-align: center;
    }
    .btn-ghost:active { opacity: 0.6; }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-light);
      font-size: 15px;
    }
  </style>
</head>
<body>

<!-- LANDING -->
<div id="screen-landing" class="screen active">
  <div class="landing-icon">📸</div>
  <h1 class="landing-title">Photo Curator</h1>
  <p class="landing-sub">Swipe left to keep, right to delete. Clean up your camera roll in seconds.</p>
  <button class="btn-primary" id="btn-select">Select Photos</button>
  <input type="file" id="file-input" accept="image/*" multiple>
</div>

<!-- SWIPER -->
<div id="screen-swiper" class="screen">
  <div id="swiper-counter">1 / 1</div>

  <div id="photo-container">
    <img id="photo-img" src="" alt="">
    <div id="decision-overlay"></div>
    <div id="decision-icon"></div>
  </div>

  <div class="tap-zone" id="tap-left"></div>
  <div class="tap-zone" id="tap-right"></div>

  <div class="hint" id="hint-left">
    <span class="hint-icon">👈</span>
    <span class="hint-label">Delete</span>
  </div>
  <div class="hint" id="hint-right">
    <span class="hint-icon">👉</span>
    <span class="hint-label">Keep</span>
  </div>
</div>

<!-- CONFIRM -->
<div id="screen-confirm" class="screen">
  <div class="confirm-header">
    <div class="confirm-icon">🗑️</div>
    <h2 class="confirm-title" id="confirm-title">Delete 0 photos?</h2>
    <p class="confirm-sub" id="confirm-sub"></p>
  </div>
  <div class="thumb-grid" id="thumb-grid"></div>
  <div class="confirm-actions">
    <button class="btn-danger" id="btn-delete">Delete via Shortcuts</button>
    <button class="btn-ghost" id="btn-copy">Copy input string</button>
    <pre id="debug-string" style="display:none;font-size:11px;background:#f0ede8;border-radius:8px;padding:12px;word-break:break-all;white-space:pre-wrap;color:#33302a;margin-top:4px;"></pre>
    <button class="btn-ghost" id="btn-restart">Start over</button>
  </div>
</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────
let photos = [];   // { file, url, name, date, decision }
let index = 0;
let hintsShown = false;

// ── Elements ───────────────────────────────────────────
const screens = {
  landing: document.getElementById('screen-landing'),
  swiper:  document.getElementById('screen-swiper'),
  confirm: document.getElementById('screen-confirm'),
};

const fileInput       = document.getElementById('file-input');
const btnSelect       = document.getElementById('btn-select');
const photoContainer  = document.getElementById('photo-container');
const photoImg        = document.getElementById('photo-img');
const decisionOverlay = document.getElementById('decision-overlay');
const decisionIcon    = document.getElementById('decision-icon');
const swiperCounter   = document.getElementById('swiper-counter');
const tapLeft         = document.getElementById('tap-left');
const tapRight        = document.getElementById('tap-right');
const hintLeft        = document.getElementById('hint-left');
const hintRight       = document.getElementById('hint-right');
const confirmTitle    = document.getElementById('confirm-title');
const confirmSub      = document.getElementById('confirm-sub');
const thumbGrid       = document.getElementById('thumb-grid');
const btnDelete       = document.getElementById('btn-delete');
const btnRestart      = document.getElementById('btn-restart');

// ── Screen helpers ──────────────────────────────────────
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  document.body.style.overflow = name === 'swiper' ? 'hidden' : '';
}

// ── EXIF / date ─────────────────────────────────────────
function formatDate(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  const yyyy = dt.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

async function getPhotoDate(file) {
  try {
    if (typeof exifr !== 'undefined') {
      const exif = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
      const raw = exif?.DateTimeOriginal ?? exif?.CreateDate;
      if (raw) return formatDate(raw);
    }
  } catch (_) {}
  return formatDate(new Date(file.lastModified));
}

// ── File loading ────────────────────────────────────────
btnSelect.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files);
  if (!files.length) return;

  btnSelect.textContent = 'Loading…';
  btnSelect.disabled = true;

  // revoke any previous object URLs
  photos.forEach(p => URL.revokeObjectURL(p.url));

  photos = await Promise.all(files.map(async (file) => ({
    file,
    url:  URL.createObjectURL(file),
    name: file.name.replace(/\.[^.]+$/, ''),
    date: await getPhotoDate(file),
    decision: null,
  })));

  btnSelect.textContent = 'Select Photos';
  btnSelect.disabled = false;
  fileInput.value = '';

  index = 0;
  hintsShown = false;
  showScreen('swiper');
  loadPhoto(index);
  showHints();
});

// ── Swiper ──────────────────────────────────────────────
function loadPhoto(i) {
  const p = photos[i];
  photoImg.src = p.url;
  photoContainer.style.transform = '';
  photoContainer.style.opacity = '';
  decisionOverlay.className = '';
  decisionIcon.className = '';
  decisionIcon.textContent = '';
  swiperCounter.textContent = `${i + 1} / ${photos.length}`;
}

function decide(action) {
  // action: 'keep' | 'delete'
  photos[index].decision = action;

  // flash icon
  decisionOverlay.className = action;
  decisionIcon.textContent = action === 'keep' ? '✓' : '✕';
  decisionIcon.classList.add('show');

  // animate card off screen
  const dir = action === 'keep' ? -1 : 1;
  photoContainer.classList.add('animating');
  photoContainer.style.transform = `translateX(${dir * 110}vw)`;
  photoContainer.style.opacity = '0';

  setTimeout(() => {
    photoContainer.classList.remove('animating');
    index++;
    if (index < photos.length) {
      loadPhoto(index);
    } else {
      showConfirm();
    }
  }, 290);
}

// ── Touch / swipe ────────────────────────────────────────
let touchStartX = 0;
let touchStartY = 0;
let dragging = false;

document.getElementById('screen-swiper').addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  dragging = false;
}, { passive: true });

document.getElementById('screen-swiper').addEventListener('touchmove', (e) => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!dragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
    dragging = true;
  }
  if (dragging) {
    photoContainer.style.transform = `translateX(${dx}px) rotate(${dx * 0.02}deg)`;
    const ratio = Math.min(Math.abs(dx) / 80, 1);
    if (dx < 0) {
      decisionOverlay.className = 'keep';
      decisionIcon.textContent = '✓';
    } else {
      decisionOverlay.className = 'delete';
      decisionIcon.textContent = '✕';
    }
    decisionOverlay.style.opacity = String(ratio * 0.8);
    if (ratio > 0.4) {
      decisionIcon.classList.add('show');
    } else {
      decisionIcon.classList.remove('show');
    }
  }
}, { passive: true });

document.getElementById('screen-swiper').addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;

  if (dragging && Math.abs(dx) > 50) {
    // committed swipe
    decisionOverlay.style.opacity = '';
    if (dx < 0) decide('keep');
    else decide('delete');
    return;
  }

  // snap back if partial drag
  if (dragging) {
    photoContainer.classList.add('animating');
    photoContainer.style.transform = '';
    photoContainer.style.opacity = '';
    decisionOverlay.className = '';
    decisionOverlay.style.opacity = '';
    decisionIcon.className = '';
    setTimeout(() => photoContainer.classList.remove('animating'), 290);
    return;
  }

  // tap zones
  const x = e.changedTouches[0].clientX;
  const w = window.innerWidth;
  if (x < w * 0.35) {
    decide('delete');
  } else if (x > w * 0.65) {
    decide('keep');
  }
  // middle zone: no action
}, { passive: true });

// ── Keyboard (desktop testing) ─────────────────────────
document.addEventListener('keydown', (e) => {
  if (!screens.swiper.classList.contains('active')) return;
  if (e.key === 'ArrowLeft')  decide('delete');
  if (e.key === 'ArrowRight') decide('keep');
});

// ── Tap zones ───────────────────────────────────────────
tapLeft.addEventListener('click',  () => decide('delete'));
tapRight.addEventListener('click', () => decide('keep'));

// ── Hint arrows ─────────────────────────────────────────
function showHints() {
  if (hintsShown) return;
  hintsShown = true;
  hintLeft.classList.add('visible');
  hintRight.classList.add('visible');
  setTimeout(() => {
    hintLeft.classList.remove('visible');
    hintRight.classList.remove('visible');
  }, 2500);
}

// ── Confirm screen ──────────────────────────────────────
function showConfirm() {
  showScreen('confirm');

  const toDelete = photos.filter(p => p.decision === 'delete');
  const total = photos.length;

  confirmTitle.textContent = `Delete ${toDelete.length} photo${toDelete.length !== 1 ? 's' : ''}?`;
  confirmSub.textContent = `${total - toDelete.length} kept · ${toDelete.length} to delete`;

  thumbGrid.innerHTML = '';
  if (toDelete.length === 0) {
    thumbGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No photos marked for deletion 🎉</div>';
    btnDelete.style.display = 'none';
  } else {
    btnDelete.style.display = '';
    toDelete.forEach(p => {
      const div = document.createElement('div');
      div.className = 'thumb-item';
      const img = document.createElement('img');
      img.src = p.url;
      img.alt = p.name;
      div.appendChild(img);
      thumbGrid.appendChild(div);
    });
  }
}

// ── Delete via Shortcuts ────────────────────────────────
function buildInput() {
  return photos.filter(p => p.decision === 'delete').map(p => `${p.name}|${p.date}`).join(',');
}

btnDelete.addEventListener('click', () => {
  const input = buildInput();
  if (!input) return;
  const url = 'shortcuts://run-shortcut?name=Delete%20Photos%20From%20Text&input=' + encodeURIComponent(input);
  window.location.href = url;
});

const btnCopy = document.getElementById('btn-copy');
const debugString = document.getElementById('debug-string');
btnCopy.addEventListener('click', () => {
  const input = buildInput();
  debugString.textContent = input;
  debugString.style.display = 'block';
  navigator.clipboard.writeText(input).then(() => {
    btnCopy.textContent = 'Copied!';
    setTimeout(() => { btnCopy.textContent = 'Copy input string'; }, 2000);
  }).catch(() => {
    btnCopy.textContent = 'See string below';
  });
});

// ── Restart ─────────────────────────────────────────────
btnRestart.addEventListener('click', () => {
  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  index = 0;
  showScreen('landing');
});
</script>
</body>
</html>
