<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Photo Curator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f4f0;
      --card: #ffffff;
      --text: #1e1b17;
      --text-light: #8a8075;
      --border: #e8e3db;
      --keep: #2d6a4f;
      --delete: #b83232;
      --keep-bg: rgba(45, 106, 79, 0.88);
      --delete-bg: rgba(184, 50, 50, 0.88);
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.11), 0 2px 4px rgba(0,0,0,0.06);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      position: fixed;
      inset: 0;
    }
    .screen.active { display: flex; }

    /* ── LANDING ── */
    #screen-landing {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 32px 28px;
      padding-top: calc(32px + var(--safe-top));
      padding-bottom: calc(32px + var(--safe-bottom));
    }

    .landing-icon-wrap {
      width: 84px;
      height: 84px;
      background: var(--text);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
    }
    .landing-icon-wrap svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .landing-title {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      text-align: center;
    }

    .landing-sub {
      font-size: 15px;
      color: var(--text-light);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .landing-last {
      width: 100%;
      max-width: 300px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 14px 12px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .landing-last-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .landing-last-month {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }
    .landing-last-thumbs {
      display: flex;
      gap: 6px;
    }
    .landing-last-thumbs img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
    }

    .btn-primary {
      width: 100%;
      max-width: 300px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 17px 40px;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
      min-height: 56px;
      box-shadow: var(--shadow-md);
    }
    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary.loading { opacity: 0.75; cursor: default; display: flex; align-items: center; justify-content: center; gap: 10px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(247,244,240,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loading-overlay.active { display: flex; }
    .loading-spinner-lg {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(30,27,23,0.12);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .loading-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-light);
    }

    #file-input { display: none; }

    /* ── SWIPER ── */
    #screen-swiper {
      background: #0a0a0a;
      flex-direction: column;
      overflow: hidden;
    }

    #swiper-progress {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.1);
      z-index: 30;
    }
    #swiper-progress-fill {
      height: 100%;
      background: rgba(255,255,255,0.65);
      transition: width 0.3s ease;
    }

    #swiper-counter {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0,0,0,0.48);
      color: rgba(255,255,255,0.88);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    #btn-rotate {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: 16px;
      z-index: 40;
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      line-height: 1;
      padding: 9px 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      min-height: 40px;
      min-width: 40px;
    }
    #btn-rotate:active { opacity: 0.65; }

    #btn-stop {
      position: absolute;
      top: calc(12px + var(--safe-top));
      right: 16px;
      z-index: 40;
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      min-height: 40px;
      letter-spacing: 0.01em;
    }
    #btn-stop:active { opacity: 0.65; }

    #btn-undo {
      position: absolute;
      bottom: calc(96px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: none;
      min-height: 40px;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    #btn-undo:active { opacity: 0.65; }

    #photo-container {
      position: absolute;
      top: calc(58px + var(--safe-top));
      left: 10px;
      right: 10px;
      bottom: 88px;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      transition: none;
    }
    #photo-container.animating {
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.28s ease;
    }

    #photo-img, #photo-video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      pointer-events: none;
      user-select: none;
      transition: transform 0.25s ease;
    }
    #photo-video { display: none; background: #000; }

    #decision-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.08s;
    }
    #decision-overlay.keep   { background: linear-gradient(120deg, rgba(45,106,79,0.55), rgba(45,106,79,0.18)); opacity: 1; }
    #decision-overlay.delete { background: linear-gradient(240deg, rgba(184,50,50,0.55), rgba(184,50,50,0.18)); opacity: 1; }

    #decision-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 15;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #fff;
      pointer-events: none;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #decision-icon.show { transform: translate(-50%, -50%) scale(1); }
    #decision-icon[data-action="keep"]   { background: var(--keep-bg);   backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    #decision-icon[data-action="delete"] { background: var(--delete-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

    /* hints */
    .hint {
      position: absolute;
      bottom: calc(96px + var(--safe-bottom));
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      opacity: 0.72;
    }
    #hint-left  { left: 22px; align-items: flex-start; }
    #hint-right { right: 22px; align-items: flex-end; }
    .hint-arrow {
      font-size: 22px;
      color: #fff;
      line-height: 1;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.55));
    }
    .hint-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 4px rgba(0,0,0,0.65);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── CONFIRM ── */
    #screen-confirm {
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(28px + var(--safe-top)) 20px calc(32px + var(--safe-bottom));
    }

    .confirm-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .confirm-icon { font-size: 40px; margin-bottom: 10px; }
    .confirm-title {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      font-weight: 600;
    }

    /* stats row */
    .confirm-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-tile {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-tile.stat-delete-tile {
      border-color: rgba(184,50,50,0.22);
      background: rgba(184,50,50,0.04);
    }
    .stat-num {
      display: block;
      font-family: 'Fraunces', serif;
      font-size: 30px;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-tile.stat-delete-tile .stat-num { color: var(--delete); }
    .stat-tile:not(.stat-delete-tile) .stat-num { color: var(--keep); }
    .stat-label-sm {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* thumb grid */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-bottom: 20px;
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .thumb-item {
      position: relative;
      aspect-ratio: 1;
      background: var(--border);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 20px;
      height: 20px;
      background: var(--delete);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-video-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    /* actions */
    .confirm-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-danger {
      background: var(--delete);
      color: #fff;
      border: none;
      border-radius: var(--radius-lg);
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 17px 24px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      min-height: 56px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(184,50,50,0.28);
    }
    .btn-danger:active { transform: scale(0.98); opacity: 0.9; }

    .actions-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .btn-ghost {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--text);
      border: none;
      border-top: 1px solid var(--border);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 15px 16px;
      cursor: pointer;
      text-align: center;
    }
    .btn-ghost:first-child { border-top: none; }
    .btn-ghost:active { background: var(--bg); }

    .btn-debug {
      background: transparent;
      color: var(--text-light);
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
    }
    .btn-debug:active { opacity: 0.6; }

    pre#debug-string {
      font-size: 11px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      word-break: break-all;
      white-space: pre-wrap;
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-light);
      font-size: 15px;
    }

    /* ── THUMB STRIP ── */
    #thumb-strip {
      position: absolute;
      bottom: calc(6px + var(--safe-bottom));
      left: 0;
      right: 0;
      height: 76px;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      z-index: 20;
    }
    #thumb-strip::-webkit-scrollbar { display: none; }

    .strip-thumb {
      flex-shrink: 0;
      width: 54px;
      height: 54px;
      border-radius: 9px;
      overflow: hidden;
      border: 2px solid transparent;
      opacity: 0.4;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .strip-thumb.active {
      opacity: 1;
      border-color: rgba(255,255,255,0.9);
    }
    .strip-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

<!-- LANDING -->
<div id="screen-landing" class="screen active">
  <div class="landing-icon-wrap">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </div>
  <h1 class="landing-title">Photo Curator</h1>
  <p class="landing-sub">Swipe left to delete, right to keep. Clean up your camera roll in seconds.</p>
  <div class="landing-last" id="landing-last" style="display:none">
    <div class="landing-last-label">Last sorted</div>
    <div class="landing-last-month" id="landing-last-month"></div>
    <div class="landing-last-thumbs" id="landing-last-thumbs"></div>
  </div>
  <button class="btn-primary" id="btn-select">Select Photos &amp; Videos</button>
  <input type="file" id="file-input" accept="image/*,video/*" multiple>
</div>

<!-- LOADING OVERLAY -->
<div id="loading-overlay">
  <div class="loading-spinner-lg"></div>
  <div class="loading-label" id="loading-label">Loading photos…</div>
</div>

<!-- SWIPER -->
<div id="screen-swiper" class="screen">
  <div id="swiper-progress"><div id="swiper-progress-fill"></div></div>
  <div id="swiper-counter">1 / 1</div>
  <button id="btn-rotate" aria-label="Rotate photo">↻</button>
  <button id="btn-stop" aria-label="Stop swiping">Done</button>
  <button id="btn-undo" aria-label="Undo">↩ Undo</button>

  <div id="photo-container">
    <img id="photo-img" src="" alt="">
    <video id="photo-video" autoplay loop muted playsinline></video>
    <div id="decision-overlay"></div>
    <div id="decision-icon"></div>
  </div>

  <div class="hint" id="hint-left">
    <span class="hint-arrow">←</span>
    <span class="hint-label">Delete</span>
  </div>
  <div class="hint" id="hint-right">
    <span class="hint-arrow">→</span>
    <span class="hint-label">Keep</span>
  </div>

  <div id="thumb-strip"></div>
</div>

<!-- CONFIRM -->
<div id="screen-confirm" class="screen">
  <div class="confirm-header">
    <div class="confirm-icon">🗑️</div>
    <h2 class="confirm-title" id="confirm-title">Review</h2>
  </div>

  <div class="confirm-stats" id="confirm-stats">
    <div class="stat-tile">
      <span class="stat-num" id="stat-kept">0</span>
      <span class="stat-label-sm">kept</span>
    </div>
    <div class="stat-tile stat-delete-tile">
      <span class="stat-num" id="stat-del">0</span>
      <span class="stat-label-sm">to delete</span>
    </div>
  </div>

  <div class="thumb-grid" id="thumb-grid"></div>

  <div class="confirm-actions">
    <button class="btn-danger" id="btn-delete">Delete</button>
    <div class="actions-secondary">
      <button class="btn-ghost" id="btn-reswipe">Restart swiping</button>
      <button class="btn-ghost" id="btn-restart">Select new photos</button>
    </div>
    <button class="btn-debug" id="btn-copy">Copy input string</button>
    <pre id="debug-string" style="display:none"></pre>
  </div>
</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────
let photos = [];   // { file, url, name, date, decision }
let index = 0;
let hintsShown = false;

// ── Last session reminder ───────────────────────────────
(function() {
  const raw = localStorage.getItem('lastSession');
  if (!raw) return;
  try {
    const { monthLabel, thumbnails } = JSON.parse(raw);
    if (!monthLabel) return;
    document.getElementById('landing-last-month').textContent = monthLabel;
    const thumbsEl = document.getElementById('landing-last-thumbs');
    (thumbnails || []).forEach(src => {
      if (!src) return;
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      thumbsEl.appendChild(img);
    });
    document.getElementById('landing-last').style.display = '';
  } catch(_) {}
})();

// ── Elements ───────────────────────────────────────────
const screens = {
  landing: document.getElementById('screen-landing'),
  swiper:  document.getElementById('screen-swiper'),
  confirm: document.getElementById('screen-confirm'),
};

const fileInput        = document.getElementById('file-input');
const btnSelect        = document.getElementById('btn-select');
const photoContainer   = document.getElementById('photo-container');
const photoImg         = document.getElementById('photo-img');
const photoVideo       = document.getElementById('photo-video');
const decisionOverlay  = document.getElementById('decision-overlay');
const decisionIcon     = document.getElementById('decision-icon');
const swiperCounter    = document.getElementById('swiper-counter');
const progressFill     = document.getElementById('swiper-progress-fill');
const hintLeft         = document.getElementById('hint-left');
const hintRight        = document.getElementById('hint-right');
const confirmTitle     = document.getElementById('confirm-title');
const thumbGrid        = document.getElementById('thumb-grid');
const btnDelete        = document.getElementById('btn-delete');
const btnRestart       = document.getElementById('btn-restart');

function activeMedia() {
  return photos[index]?.type === 'video' ? photoVideo : photoImg;
}

// ── Screen helpers ──────────────────────────────────────
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  document.body.style.overflow = name === 'swiper' ? 'hidden' : '';
}

// ── EXIF / date ─────────────────────────────────────────
function formatDate(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  const yyyy = dt.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

async function getPhotoDate(file) {
  try {
    if (typeof exifr !== 'undefined') {
      const exif = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
      const raw = exif?.DateTimeOriginal ?? exif?.CreateDate;
      if (raw) return formatDate(raw);
    }
  } catch (_) {}
  return formatDate(new Date(file.lastModified));
}

// ── Video thumbnail ─────────────────────────────────────
function getVideoThumb(url) {
  return new Promise((resolve) => {
    const v = document.createElement('video');
    v.muted = true;
    v.src = url;
    v.currentTime = 0.5;
    const done = () => {
      try {
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(v.videoWidth, v.videoHeight);
        ctx.drawImage(v, (v.videoWidth-min)/2, (v.videoHeight-min)/2, min, min, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      } catch(_) { resolve(''); }
    };
    v.addEventListener('seeked', done, { once: true });
    v.addEventListener('error',  () => resolve(''), { once: true });
    v.load();
  });
}

// ── File loading ────────────────────────────────────────
btnSelect.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files);
  if (!files.length) return;

  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingLabel   = document.getElementById('loading-label');

  btnSelect.innerHTML = '<span class="spinner"></span>Loading…';
  btnSelect.classList.add('loading');
  btnSelect.disabled = true;
  loadingOverlay.classList.add('active');
  loadingLabel.textContent = `Loading ${files.length} item${files.length !== 1 ? 's' : ''}…`;

  photos.forEach(p => URL.revokeObjectURL(p.url));

  photos = await Promise.all(files.map(async (file) => {
    const isVideo = file.type.startsWith('video/');
    const url = URL.createObjectURL(file);
    const date = isVideo ? formatDate(new Date(file.lastModified)) : await getPhotoDate(file);
    const thumb = isVideo ? await getVideoThumb(url) : null;
    return {
      file, url,
      name:     file.name.replace(/\.[^.]+$/, ''),
      date,
      decision: null,
      rotation: 0,
      type:     isVideo ? 'video' : 'image',
      thumb,
    };
  }));

  photos.sort((a, b) => {
    const parse = d => { const [dd,mm,yyyy] = d.split('/'); return new Date(yyyy, mm-1, dd); };
    return parse(a.date) - parse(b.date);
  });

  loadingOverlay.classList.remove('active');
  btnSelect.innerHTML = 'Select Photos';
  btnSelect.classList.remove('loading');
  btnSelect.disabled = false;
  fileInput.value = '';

  index = 0;
  hintsShown = false;
  showScreen('swiper');
  populateThumbStrip();
  loadPhoto(index);
  showHints();
});

// ── Thumb strip ─────────────────────────────────────────
const thumbStrip = document.getElementById('thumb-strip');

function populateThumbStrip() {
  thumbStrip.innerHTML = '';
  photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'strip-thumb' + (i === 0 ? ' active' : '');
    const img = document.createElement('img');
    img.src = p.type === 'video' ? (p.thumb || '') : p.url;
    img.alt = '';
    div.appendChild(img);
    thumbStrip.appendChild(div);
  });
}

function updateThumbStrip(i) {
  const thumbs = thumbStrip.querySelectorAll('.strip-thumb');
  thumbs.forEach((t, ti) => t.classList.toggle('active', ti === i));
  if (thumbs[i]) thumbs[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

// ── Swiper ──────────────────────────────────────────────
const btnUndo = document.getElementById('btn-undo');

// ── Zoom / pan state ────────────────────────────────────
let zoom = 1, panX = 0, panY = 0;

function applyMediaTransform() {
  const r = photos[index]?.rotation ?? 0;
  const t = [
    (panX || panY) ? `translate(${panX}px,${panY}px)` : '',
    zoom !== 1     ? `scale(${zoom})` : '',
    r              ? `rotate(${r}deg)` : '',
  ].filter(Boolean).join(' ');
  photoImg.style.transform   = t;
  photoVideo.style.transform = t;
}

function resetZoom() {
  zoom = 1; panX = 0; panY = 0;
  applyMediaTransform();
}

function loadPhoto(i) {
  const p = photos[i];
  zoom = 1; panX = 0; panY = 0;

  if (p.type === 'video') {
    photoImg.style.display   = 'none';
    photoVideo.style.display = '';
    photoVideo.style.transition = 'none';
    photoVideo.src = p.url;
    photoVideo.play().catch(() => {});
  } else {
    photoVideo.pause();
    photoVideo.src = '';
    photoVideo.style.display = 'none';
    photoImg.style.display   = '';
    photoImg.style.transition = 'none';
    photoImg.src = p.url;
  }

  applyMediaTransform();
  requestAnimationFrame(() => {
    photoImg.style.transition   = '';
    photoVideo.style.transition = '';
  });
  photoContainer.style.transform = '';
  photoContainer.style.opacity   = '';
  decisionOverlay.className = '';
  decisionIcon.className    = '';
  decisionIcon.textContent  = '';
  delete decisionIcon.dataset.action;
  swiperCounter.textContent = `${i + 1} / ${photos.length}`;
  progressFill.style.width  = `${(i + 1) / photos.length * 100}%`;
  btnUndo.style.display     = i > 0 ? 'block' : 'none';
  updateThumbStrip(i);
}

document.getElementById('btn-rotate').addEventListener('click', () => {
  if (!photos.length) return;
  photos[index].rotation = (photos[index].rotation + 90) % 360;
  applyMediaTransform();
});

function undo() {
  if (index === 0) return;
  index--;
  photos[index].decision = null;
  photoContainer.classList.remove('animating');
  loadPhoto(index);
}

function todayFormatted() {
  const now = new Date();
  const dd = String(now.getDate()).padStart(2, '0');
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const yyyy = now.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function getMonthLabel() {
  if (!photos.length) return '';
  const counts = {};
  photos.forEach(p => {
    const [, mm, yyyy] = p.date.split('/');
    const key = `${yyyy}-${mm}`;
    counts[key] = (counts[key] || 0) + 1;
  });
  const [yyyy, mm] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0].split('-');
  return new Date(+yyyy, +mm - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}

async function saveSessionData() {
  const monthLabel = getMonthLabel();
  if (!monthLabel) return;
  const kept = photos.filter(p => p.decision === 'keep').slice(0, 3);
  const thumbnails = await Promise.all(kept.map(p => {
    if (p.type === 'video') return Promise.resolve(p.thumb || '');
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const size = 80;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.naturalWidth, img.naturalHeight);
          ctx.drawImage(img, (img.naturalWidth - min) / 2, (img.naturalHeight - min) / 2, min, min, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.65));
        } catch (_) { resolve(''); }
      };
      img.onerror = () => resolve('');
      img.src = p.url;
    });
  }));
  try {
    localStorage.setItem('lastSession', JSON.stringify({ monthLabel, thumbnails: thumbnails.filter(Boolean) }));
  } catch (_) {}
}

function decide(action) {
  photos[index].decision = action;

  decisionOverlay.className = action;
  decisionIcon.dataset.action = action;
  decisionIcon.textContent = action === 'keep' ? '✓' : '✕';
  decisionIcon.classList.add('show');

  const dir = action === 'keep' ? -1 : 1;
  photoContainer.classList.add('animating');
  photoContainer.style.transform = `translateX(${dir * 110}vw)`;
  photoContainer.style.opacity = '0';

  setTimeout(() => {
    photoContainer.classList.remove('animating');
    index++;
    if (index < photos.length) {
      loadPhoto(index);
    } else {
      showConfirm();
    }
  }, 290);
}

// ── Touch / swipe / zoom / pan ───────────────────────────
let touchStartX = 0, touchStartY = 0;
let dragging = false;
let pinching = false, pinchStartDist = 0, pinchStartZoom = 1;
let panStartX = 0, panStartY = 0, panStartOffsetX = 0, panStartOffsetY = 0;
let lastTapTime = 0;

function pinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

const swiper = document.getElementById('screen-swiper');

swiper.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinching = true;
    dragging = false;
    pinchStartDist = pinchDist(e.touches);
    pinchStartZoom = zoom;
    return;
  }
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  panStartX = e.touches[0].clientX;
  panStartY = e.touches[0].clientY;
  panStartOffsetX = panX;
  panStartOffsetY = panY;
  dragging = false;
}, { passive: true });

swiper.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinching) {
    const dist = pinchDist(e.touches);
    zoom = Math.min(5, Math.max(1, pinchStartZoom * dist / pinchStartDist));
    applyMediaTransform();
    return;
  }
  if (zoom > 1) {
    // pan mode
    panX = panStartOffsetX + (e.touches[0].clientX - panStartX);
    panY = panStartOffsetY + (e.touches[0].clientY - panStartY);
    applyMediaTransform();
    return;
  }
  // swipe mode
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!dragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) dragging = true;
  if (dragging) {
    photoContainer.style.transform = `translateX(${dx}px) rotate(${dx * 0.02}deg)`;
    const ratio = Math.min(Math.abs(dx) / 80, 1);
    const action = dx < 0 ? 'delete' : 'keep';
    decisionOverlay.className = action;
    decisionOverlay.style.opacity = String(ratio * 0.8);
    decisionIcon.dataset.action = action;
    decisionIcon.textContent = dx < 0 ? '✕' : '✓';
    decisionIcon.classList.toggle('show', ratio > 0.4);
  }
}, { passive: true });

swiper.addEventListener('touchend', (e) => {
  if (pinching) {
    pinching = false;
    if (zoom < 1.05) resetZoom();
    return;
  }

  const dx = e.changedTouches[0].clientX - touchStartX;

  if (!dragging && zoom === 1) {
    const now = Date.now();
    if (now - lastTapTime < 300) resetZoom();
    lastTapTime = now;
    return;
  }

  if (zoom > 1) return; // end pan — keep position

  if (dragging && Math.abs(dx) > 50) {
    decisionOverlay.style.opacity = '';
    if (dx < 0) decide('delete');
    else decide('keep');
    return;
  }

  if (dragging) {
    photoContainer.classList.add('animating');
    photoContainer.style.transform = '';
    photoContainer.style.opacity = '';
    decisionOverlay.className = '';
    decisionOverlay.style.opacity = '';
    decisionIcon.className = '';
    delete decisionIcon.dataset.action;
    setTimeout(() => photoContainer.classList.remove('animating'), 290);
  }
}, { passive: true });

// ── Keyboard (desktop testing) ─────────────────────────
document.addEventListener('keydown', (e) => {
  if (!screens.swiper.classList.contains('active')) return;
  if (e.key === 'ArrowLeft')  decide('delete');
  if (e.key === 'ArrowRight') decide('keep');
  if (e.key === 'Backspace' || e.key === 'z') undo();
});

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-stop').addEventListener('click', showConfirm);

// ── Hint arrows ─────────────────────────────────────────
function showHints() {
  hintLeft.classList.add('visible');
  hintRight.classList.add('visible');
}

// ── Confirm screen ──────────────────────────────────────
function showConfirm() {
  showScreen('confirm');
  saveSessionData();

  const toDelete = photos.filter(p => p.decision === 'delete');
  const kept = photos.length - toDelete.length;

  confirmTitle.textContent = `Delete ${toDelete.length} photo${toDelete.length !== 1 ? 's' : ''}?`;
  document.getElementById('stat-kept').textContent = kept;
  document.getElementById('stat-del').textContent  = toDelete.length;

  thumbGrid.innerHTML = '';
  if (toDelete.length === 0) {
    thumbGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No photos marked for deletion 🎉</div>';
    btnDelete.style.display = 'none';
  } else {
    btnDelete.style.display = '';
    toDelete.forEach(p => {
      const div = document.createElement('div');
      div.className = 'thumb-item';
      const img = document.createElement('img');
      img.src = p.type === 'video' ? p.thumb : p.url;
      img.alt = p.name;
      const badge = document.createElement('div');
      badge.className = 'thumb-badge';
      badge.textContent = '✕';
      div.appendChild(img);
      div.appendChild(badge);
      if (p.type === 'video') {
        const vbadge = document.createElement('div');
        vbadge.className = 'thumb-video-badge';
        vbadge.textContent = '▶';
        div.appendChild(vbadge);
      }
      thumbGrid.appendChild(div);
    });
  }
}

// ── Delete via Shortcuts ────────────────────────────────
function buildInput() {
  return photos.filter(p => p.decision === 'delete').map(p => `${p.name}|${p.date}`).join(',');
}

btnDelete.addEventListener('click', () => {
  const input = buildInput();
  if (!input) return;
  const url = 'shortcuts://run-shortcut?name=Delete%20Photos%20From%20Text&input=' + encodeURIComponent(input);
  window.location.href = url;
});

const btnCopy = document.getElementById('btn-copy');
const debugString = document.getElementById('debug-string');
btnCopy.addEventListener('click', () => {
  const input = buildInput();
  debugString.textContent = input;
  debugString.style.display = 'block';
  navigator.clipboard.writeText(input).then(() => {
    btnCopy.textContent = 'Copied!';
    setTimeout(() => { btnCopy.textContent = 'Copy input string'; }, 2000);
  }).catch(() => {
    btnCopy.textContent = 'See string below';
  });
});

// ── Restart swiping (same photos, reset decisions) ──────
document.getElementById('btn-reswipe').addEventListener('click', () => {
  photos.forEach(p => { p.decision = null; });
  index = 0;
  showScreen('swiper');
  populateThumbStrip();
  loadPhoto(0);
  showHints();
});

// ── Select new photos ────────────────────────────────────
btnRestart.addEventListener('click', () => {
  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  index = 0;
  showScreen('landing');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/photo-curator/sw.js');
}
</script>
