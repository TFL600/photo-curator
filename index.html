<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Photo Curator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f4f0;
      --card: #ffffff;
      --text: #1e1b17;
      --text-light: #8a8075;
      --border: #e8e3db;
      --keep: #2d6a4f;
      --delete: #b83232;
      --keep-bg: rgba(45, 106, 79, 0.88);
      --delete-bg: rgba(184, 50, 50, 0.88);
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.11), 0 2px 4px rgba(0,0,0,0.06);
      --album: #4a6fa5;
      --album-bg: rgba(74, 111, 165, 0.88);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      position: fixed;
      inset: 0;
    }
    .screen.active { display: flex; }

    /* ── LANDING ── */
    #screen-landing {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 32px 28px;
      padding-top: calc(32px + var(--safe-top));
      padding-bottom: calc(32px + var(--safe-bottom));
    }

    .landing-icon-wrap {
      width: 84px;
      height: 84px;
      background: var(--text);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
    }
    .landing-icon-wrap svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .landing-title {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      text-align: center;
    }

    .landing-sub {
      font-size: 15px;
      color: var(--text-light);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .landing-hints {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      opacity: 0.65;
    }
    .landing-hint-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .landing-hint-arrow {
      font-size: 17px;
      color: var(--text-light);
      line-height: 1;
    }
    .landing-hint-text {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-light);
    }

    .landing-last {
      width: 100%;
      max-width: 300px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 14px 12px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .landing-last-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .landing-last-month {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }
    .landing-last-thumbs {
      display: flex;
      gap: 6px;
    }
    .landing-last-thumbs img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
    }

    .btn-primary {
      width: 100%;
      max-width: 300px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 17px 40px;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
      min-height: 56px;
      box-shadow: var(--shadow-md);
    }
    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary.loading { opacity: 0.75; cursor: default; display: flex; align-items: center; justify-content: center; gap: 10px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(247,244,240,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loading-overlay.active { display: flex; }
    .loading-spinner-lg {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(30,27,23,0.12);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .loading-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-light);
    }

    #file-input { display: none; }

    /* ── SWIPER ── */
    #screen-swiper {
      background: #0a0a0a;
      flex-direction: column;
      overflow: hidden;
    }

    #swiper-progress {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.1);
      z-index: 30;
    }
    #swiper-progress-fill {
      height: 100%;
      background: rgba(255,255,255,0.65);
      transition: width 0.3s ease;
    }

    #swiper-counter {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0,0,0,0.48);
      color: rgba(255,255,255,0.88);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    #btn-rotate {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: 16px;
      z-index: 40;
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      line-height: 1;
      padding: 9px 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      min-height: 40px;
      min-width: 40px;
    }
    #btn-rotate:active { opacity: 0.65; }

    #btn-stop {
      position: absolute;
      top: calc(12px + var(--safe-top));
      right: 16px;
      z-index: 40;
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      min-height: 40px;
      letter-spacing: 0.01em;
    }
    #btn-stop:active { opacity: 0.65; }

    #btn-undo {
      position: absolute;
      bottom: calc(90px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: none;
      min-height: 40px;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    #btn-undo:active { opacity: 0.65; }

    #photo-container {
      position: absolute;
      top: calc(58px + var(--safe-top));
      left: 10px;
      right: 10px;
      bottom: 88px;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      transition: none;
    }
    #photo-container.animating {
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.28s ease;
    }

    #photo-img, #photo-video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      pointer-events: none;
      user-select: none;
      transition: transform 0.25s ease;
    }
    #photo-video { display: none; background: #000; }

    #decision-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.08s;
    }
    #decision-overlay.keep   { background: linear-gradient(120deg, rgba(45,106,79,0.55), rgba(45,106,79,0.18)); opacity: 1; }
    #decision-overlay.delete { background: linear-gradient(240deg, rgba(184,50,50,0.55), rgba(184,50,50,0.18)); opacity: 1; }
    #decision-overlay.album  { background: linear-gradient(0deg, rgba(74,111,165,0.55), rgba(74,111,165,0.18)); opacity: 1; }

    #decision-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 15;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #fff;
      pointer-events: none;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #decision-icon.show { transform: translate(-50%, -50%) scale(1); }
    #decision-icon[data-action="keep"]   { background: var(--keep-bg);   backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    #decision-icon[data-action="delete"] { background: var(--delete-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    #decision-icon[data-action="album"]  { background: var(--album-bg);  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

    /* hints */
    .hint {
      position: absolute;
      bottom: calc(90px + var(--safe-bottom));
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      opacity: 0.72;
    }
    #hint-left  { left: 22px; align-items: flex-start; }
    #hint-right { right: 22px; align-items: flex-end; }
    #hint-up {
      bottom: auto;
      top: calc(60px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      align-items: center;
    }
    .hint-arrow {
      font-size: 22px;
      color: #fff;
      line-height: 1;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.55));
    }
    .hint-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 4px rgba(0,0,0,0.65);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── VIDEO CONTROLS ── */
    #video-controls {
      position: absolute;
      bottom: calc(138px + var(--safe-bottom));
      left: 10px;
      right: 10px;
      z-index: 25;
      display: none;
    }
    #video-progress-wrap {
      height: 4px;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
      margin-bottom: 10px;
      position: relative;
      touch-action: none;
    }
    #video-progress-bar {
      height: 100%;
      background: rgba(255,255,255,0.85);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      transition: width 0.1s linear;
    }
    #video-bottom-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(20,20,22,0.42);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.28);
    }
    #btn-mute {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 50%;
      color: rgba(255,255,255,0.92);
      font-size: 15px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    #btn-mute:active { transform: scale(0.88); background: rgba(255,255,255,0.20); }
    #video-speed-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.22);
      outline: none;
      cursor: pointer;
    }
    #video-speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: none;
      box-shadow: 0 1px 5px rgba(0,0,0,0.45);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    #video-speed-slider:active::-webkit-slider-thumb { transform: scale(1.18); }
    #video-speed-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: none;
      box-shadow: 0 1px 5px rgba(0,0,0,0.45);
      cursor: pointer;
    }
    #video-speed-slider::-moz-range-track {
      height: 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.22);
    }
    #video-speed-label {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      min-width: 30px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── CONFIRM ── */
    #screen-confirm {
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(28px + var(--safe-top)) 20px calc(32px + var(--safe-bottom));
    }

    .confirm-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .confirm-icon { font-size: 40px; margin-bottom: 10px; }
    .confirm-title {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      font-weight: 600;
    }

    /* stats row */
    .confirm-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-tile {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-tile.stat-delete-tile {
      border-color: rgba(184,50,50,0.22);
      background: rgba(184,50,50,0.04);
    }
    .stat-tile.stat-album-tile {
      border-color: rgba(74,111,165,0.22);
      background: rgba(74,111,165,0.04);
    }
    .stat-num {
      display: block;
      font-family: 'Fraunces', serif;
      font-size: 30px;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-tile.stat-delete-tile .stat-num { color: var(--delete); }
    .stat-tile.stat-album-tile .stat-num { color: var(--album); }
    .stat-tile:not(.stat-delete-tile):not(.stat-album-tile) .stat-num { color: var(--keep); }
    .stat-label-sm {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* thumb grid */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-bottom: 20px;
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .thumb-item {
      position: relative;
      aspect-ratio: 1;
      background: var(--border);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 20px;
      height: 20px;
      background: var(--delete);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-video-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    /* actions */
    .confirm-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-danger {
      background: var(--delete);
      color: #fff;
      border: none;
      border-radius: var(--radius-lg);
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 17px 24px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      min-height: 56px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(184,50,50,0.28);
    }
    .btn-danger:active { transform: scale(0.98); opacity: 0.9; }

    .actions-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .btn-ghost {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--text);
      border: none;
      border-top: 1px solid var(--border);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 15px 16px;
      cursor: pointer;
      text-align: center;
    }
    .btn-ghost:first-child { border-top: none; }
    .btn-ghost:active { background: var(--bg); }

    .btn-debug {
      background: transparent;
      color: var(--text-light);
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
    }
    .btn-debug:active { opacity: 0.6; }

    pre#debug-string {
      font-size: 11px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      word-break: break-all;
      white-space: pre-wrap;
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-light);
      font-size: 15px;
    }

    .section-title {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .btn-album-shortcut {
      background: var(--album);
      color: #fff;
      border: none;
      border-radius: var(--radius-lg);
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 17px 24px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      min-height: 56px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(74,111,165,0.28);
      width: 100%;
    }
    .btn-album-shortcut:active { transform: scale(0.98); opacity: 0.9; }

    /* ── THUMB STRIP ── */
    #thumb-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(76px + var(--safe-bottom));
      display: flex;
      align-items: flex-start;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 11px 10px 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      z-index: 20;
    }
    #thumb-strip::-webkit-scrollbar { display: none; }

    .strip-thumb {
      flex-shrink: 0;
      width: 54px;
      height: 54px;
      border-radius: 9px;
      overflow: hidden;
      border: 2px solid transparent;
      opacity: 0.4;
      transition: opacity 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .strip-thumb.active {
      opacity: 1;
      border-color: rgba(255,255,255,0.9);
    }
    .strip-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── END OF STACK ── */
    #end-of-stack {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: #0a0a0a;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 40px 32px;
      padding-top: calc(40px + var(--safe-top));
      padding-bottom: calc(40px + var(--safe-bottom));
      text-align: center;
    }
    #end-of-stack.active { display: flex; }
    #end-of-stack h2 {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    #end-of-stack p {
      font-size: 15px;
      color: rgba(255,255,255,0.55);
      line-height: 1.55;
      max-width: 280px;
      margin-bottom: 18px;
    }
    .btn-eos {
      width: 100%;
      max-width: 320px;
      border: none;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 17px 24px;
      cursor: pointer;
      min-height: 56px;
      transition: opacity 0.12s, transform 0.12s;
    }
    .btn-eos:active { opacity: 0.8; transform: scale(0.97); }
    .btn-eos-primary { background: #fff; color: #0a0a0a; }
    .btn-eos-secondary { background: rgba(255,255,255,0.13); color: rgba(255,255,255,0.88); }
  </style>
</head>
<body>

<!-- LANDING -->
<div id="screen-landing" class="screen active">
  <div class="landing-icon-wrap">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </div>
  <h1 class="landing-title">Photo Curator</h1>
  <p class="landing-sub">Swipe to sort your camera roll in seconds.</p>
  <div class="landing-hints">
    <div class="landing-hint-item">
      <span class="landing-hint-arrow">←</span>
      <span class="landing-hint-text">Delete</span>
    </div>
    <div class="landing-hint-item">
      <span class="landing-hint-arrow">↑</span>
      <span class="landing-hint-text">Album</span>
    </div>
    <div class="landing-hint-item">
      <span class="landing-hint-arrow">→</span>
      <span class="landing-hint-text">Keep</span>
    </div>
  </div>
  <div class="landing-last" id="landing-last" style="display:none">
    <div class="landing-last-label">Last sorted</div>
    <div class="landing-last-month" id="landing-last-month"></div>
    <div class="landing-last-thumbs" id="landing-last-thumbs"></div>
  </div>
  <button class="btn-primary" id="btn-select">Select Photos &amp; Videos</button>
  <input type="file" id="file-input" accept="image/*,video/*" multiple>
</div>

<!-- LOADING OVERLAY -->
<div id="loading-overlay">
  <div class="loading-spinner-lg"></div>
  <div class="loading-label" id="loading-label">Loading photos…</div>
</div>

<!-- SWIPER -->
<div id="screen-swiper" class="screen">
  <div id="swiper-progress"><div id="swiper-progress-fill"></div></div>
  <div id="swiper-counter">1 / 1</div>
  <button id="btn-rotate" aria-label="Rotate photo">↻</button>
  <button id="btn-stop" aria-label="Stop swiping">Done</button>
  <button id="btn-undo" aria-label="Undo">↩ Undo</button>

  <div id="photo-container">
    <img id="photo-img" src="" alt="">
    <video id="photo-video" autoplay loop playsinline></video>
    <div id="decision-overlay"></div>
    <div id="decision-icon"></div>
  </div>

  <div class="hint" id="hint-left">
    <span class="hint-arrow">←</span>
    <span class="hint-label">Delete</span>
  </div>
  <div class="hint" id="hint-right">
    <span class="hint-arrow">→</span>
    <span class="hint-label">Keep</span>
  </div>

  <div id="video-controls">

  <div id="thumb-strip"></div>

  <div id="end-of-stack">
    <h2>End of stack</h2>
    <p id="eos-message">You've reached the end, but some photos haven't been sorted yet.</p>
    <button class="btn-eos btn-eos-primary" id="btn-show-unsorted">👁 Show unsorted</button>
    <button class="btn-eos btn-eos-secondary" id="btn-eos-done">✓ Done</button>

<!-- CONFIRM -->
<div id="screen-confirm" class="screen">
  <div class="confirm-header">
    <div class="confirm-icon">🗑️</div>
    <h2 class="confirm-title" id="confirm-title">Review</h2>
  </div>

  <div class="confirm-stats" id="confirm-stats">
    <div class="stat-tile">
      <span class="stat-num" id="stat-kept">0</span>
      <span class="stat-label-sm">kept</span>
    </div>
    <div class="stat-tile stat-delete-tile">
      <span class="stat-num" id="stat-del">0</span>
      <span class="stat-label-sm">to delete</span>
    </div>
    <div class="stat-tile stat-album-tile" id="stat-album-tile" style="display:none">
      <span class="stat-num" id="stat-album">0</span>
      <span class="stat-label-sm">album</span>
    </div>
  </div>

  <div class="thumb-grid" id="thumb-grid"></div>

  <div id="album-section" style="display:none">
    <h3 class="section-title">★ Album</h3>

    <button class="btn-debug" id="btn-copy-album">Copy album list</button>

  </div>

  <div class="confirm-actions">
    <button class="btn-danger" id="btn-delete">Delete</button>
    <div class="actions-secondary">
      <button class="btn-ghost" id="btn-reswipe">Restart swiping</button>
      <button class="btn-ghost" id="btn-restart">Select new photos</button>
    </div>
    <button class="btn-debug" id="btn-copy">Copy input string</button>
    <pre id="debug-string" style="display:none"></pre>
  </div>
</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────
let photos = [];   // { file, url, name, date, decision }
let index = 0;
let hintsShown = false;
let decisionStack = []; // indices of decided photos in order (for undo)
const stripThumbs = []; // DOM refs indexed by photo index
let sessionPlaybackRate = 1;
let sessionMuted = false;

// ── Last session reminder ───────────────────────────────
(function() {
  const raw = localStorage.getItem('lastSession');
  if (!raw) return;
  try {
    const { monthLabel, thumbnails } = JSON.parse(raw);
    if (!monthLabel) return;
    document.getElementById('landing-last-month').textContent = monthLabel;
    const thumbsEl = document.getElementById('landing-last-thumbs');
    (thumbnails || []).forEach(src => {
      if (!src) return;
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      thumbsEl.appendChild(img);
    });
    document.getElementById('landing-last').style.display = '';
  } catch(_) {}
})();

// ── Elements ───────────────────────────────────────────
const screens = {
  landing: document.getElementById('screen-landing'),
  swiper:  document.getElementById('screen-swiper'),
  confirm: document.getElementById('screen-confirm'),
};

const fileInput        = document.getElementById('file-input');
const btnSelect        = document.getElementById('btn-select');
const photoContainer   = document.getElementById('photo-container');
const photoImg         = document.getElementById('photo-img');
const photoVideo       = document.getElementById('photo-video');
const decisionOverlay  = document.getElementById('decision-overlay');
const decisionIcon     = document.getElementById('decision-icon');
const swiperCounter    = document.getElementById('swiper-counter');
const progressFill     = document.getElementById('swiper-progress-fill');
const hintLeft         = document.getElementById('hint-left');
const hintRight        = document.getElementById('hint-right');
const confirmTitle     = document.getElementById('confirm-title');
const thumbGrid        = document.getElementById('thumb-grid');
const btnDelete        = document.getElementById('btn-delete');
const btnRestart       = document.getElementById('btn-restart');
const videoControls    = document.getElementById('video-controls');
const videoProgressWrap = document.getElementById('video-progress-wrap');
const videoProgressBar = document.getElementById('video-progress-bar');
const videoSpeedSlider = document.getElementById('video-speed-slider');
const videoSpeedLabel  = document.getElementById('video-speed-label');
const btnMute          = document.getElementById('btn-mute');

function activeMedia() {
  return photos[index]?.type === 'video' ? photoVideo : photoImg;
}

// ── Screen helpers ──────────────────────────────────────
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  document.body.style.overflow = name === 'swiper' ? 'hidden' : '';
  document.body.style.background = name === 'swiper' ? '#0a0a0a' : '';
}

// ── EXIF / date ─────────────────────────────────────────
function formatDate(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  const yyyy = dt.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

async function getPhotoDate(file) {
  try {
    if (typeof exifr !== 'undefined') {
      const exif = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
      const raw = exif?.DateTimeOriginal ?? exif?.CreateDate;
      if (raw) return formatDate(raw);
    }
  } catch (_) {}
  return formatDate(new Date(file.lastModified));
}

// ── Video thumbnail ─────────────────────────────────────
function getVideoThumb(url) {
  return new Promise((resolve) => {
    const v = document.createElement('video');
    v.muted = true;
    v.src = url;
    v.currentTime = 0.5;
    const done = () => {
      try {
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(v.videoWidth, v.videoHeight);
        ctx.drawImage(v, (v.videoWidth-min)/2, (v.videoHeight-min)/2, min, min, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      } catch(_) { resolve(''); }
    };
    v.addEventListener('seeked', done, { once: true });
    v.addEventListener('error',  () => resolve(''), { once: true });
    v.load();
  });
}

// ── File loading ────────────────────────────────────────
btnSelect.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files);
  if (!files.length) return;

  btnSelect.innerHTML = '<span class="spinner"></span>Loading…';
  btnSelect.classList.add('loading');
  btnSelect.disabled = true;

  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  index = 0;
  hintsShown = false;
  decisionStack = [];
  stripThumbs.length = 0;
  fileInput.value = '';

  let done = 0;
  const total = files.length;
  const tick = () => { btnSelect.innerHTML = `<span class="spinner"></span>Loading ${++done}/${total}…`; };

  async function processFile(file) {
    const isVideo = file.type.startsWith('video/');
    const url = URL.createObjectURL(file);
    const date = isVideo ? formatDate(new Date(file.lastModified)) : await getPhotoDate(file);
    tick();
    return { file, url, name: file.name.replace(/\.[^.]+$/, ''), date, decision: null, rotation: 0, type: isVideo ? 'video' : 'image', thumb: null };
  }

  const entries = await Promise.all(files.map(f => processFile(f)));
  const parse = d => { const [dd,mm,yyyy] = d.split('/'); return new Date(yyyy, mm-1, dd); };
  entries.sort((a, b) => parse(a.date) - parse(b.date));
  photos.push(...entries);

  btnSelect.innerHTML = 'Select Photos';
  btnSelect.classList.remove('loading');
  btnSelect.disabled = false;
  showScreen('swiper');
  populateThumbStrip();
  loadPhoto(0);
  showHints();
});

// ── Thumb strip ─────────────────────────────────────────
const thumbStrip = document.getElementById('thumb-strip');

function populateThumbStrip() {
  thumbStrip.innerHTML = '';
  stripThumbs.length = 0;
  photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'strip-thumb';
    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    if (p.type === 'video') {
      if (p.thumb) { img.src = p.thumb; }
      else { getVideoThumb(p.url).then(t => { p.thumb = t; img.src = t; }); }
    } else {
      img.src = p.url;
    }
    div.appendChild(img);
    div.addEventListener('click', () => navigateTo(i));
    thumbStrip.appendChild(div);
    stripThumbs[i] = div;
  });
}

function updateThumbStrip(i) {
  stripThumbs.forEach((t, ti) => { if (t) t.classList.toggle('active', ti === i); });
  if (stripThumbs[i]) stripThumbs[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

// Drag-to-scrub on the thumb strip
let stripScrubbing = false;
let lastStripIndex = -1;
function doStripScrub(touch) {
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const thumb = el?.closest?.('.strip-thumb');
  if (!thumb) return;
  const i = stripThumbs.indexOf(thumb);
  if (i !== -1 && i !== lastStripIndex && photos[i]) {
    lastStripIndex = i;
    navigateTo(i);
  }
}
thumbStrip.addEventListener('touchstart', (e) => {
  e.stopPropagation();
  stripScrubbing = true;
  lastStripIndex = -1;
  doStripScrub(e.touches[0]);
}, { passive: true });
thumbStrip.addEventListener('touchmove', (e) => {
  if (!stripScrubbing) return;
  e.stopPropagation();
  doStripScrub(e.touches[0]);
}, { passive: true });
thumbStrip.addEventListener('touchend', (e) => {
  e.stopPropagation();
  stripScrubbing = false;
  lastStripIndex = -1;
});

// ── Video controls ──────────────────────────────────────
photoVideo.addEventListener('timeupdate', () => {
  if (!photoVideo.duration) return;
  videoProgressBar.style.width = (photoVideo.currentTime / photoVideo.duration * 100) + '%';
});

videoSpeedSlider.addEventListener('input', () => {
  sessionPlaybackRate = parseFloat(videoSpeedSlider.value);
  photoVideo.playbackRate = sessionPlaybackRate;
  videoSpeedLabel.textContent = sessionPlaybackRate + '×';
});

btnMute.addEventListener('click', () => {
  sessionMuted = !sessionMuted;
  photoVideo.muted = sessionMuted;
  btnMute.textContent = sessionMuted ? '🔇' : '🔊';
});

let videoScrubbing = false;
function applyVideoScrub(touch) {
  const rect = videoProgressWrap.getBoundingClientRect();
  const fraction = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
  if (photoVideo.duration) photoVideo.currentTime = fraction * photoVideo.duration;
}
videoProgressWrap.addEventListener('touchstart', (e) => {
  e.stopPropagation();
  videoScrubbing = true;
  applyVideoScrub(e.touches[0]);
}, { passive: true });
videoProgressWrap.addEventListener('touchmove', (e) => {
  if (!videoScrubbing) return;
  e.stopPropagation();
  applyVideoScrub(e.touches[0]);
}, { passive: true });
videoProgressWrap.addEventListener('touchend', () => { videoScrubbing = false; });

// ── Swiper ──────────────────────────────────────────────
const btnUndo = document.getElementById('btn-undo');

// ── Zoom / pan state ────────────────────────────────────
let zoom = 1, panX = 0, panY = 0;

function applyMediaTransform() {
  const r = photos[index]?.rotation ?? 0;
  const t = [
    (panX || panY) ? `translate(${panX}px,${panY}px)` : '',
    zoom !== 1     ? `scale(${zoom})` : '',
    r              ? `rotate(${r}deg)` : '',
  ].filter(Boolean).join(' ');
  photoImg.style.transform   = t;
  photoVideo.style.transform = t;
}

function resetZoom() {
  zoom = 1; panX = 0; panY = 0;
  applyMediaTransform();
}

let preloadImg = new Image();
let preloadVideo = document.createElement('video');
preloadVideo.muted = true;
preloadVideo.preload = 'auto';

function findNext(from) {
  for (let i = from + 1; i < photos.length; i++) {
    if (photos[i].decision === null) return i;
  }
  return -1;
}

function findPrev(from) {
  for (let i = from - 1; i >= 0; i--) {
    if (photos[i].decision === null) return i;
  }
  return -1;
}

function preloadNext(i) {
  const ni = findNext(i);
  if (ni === -1) return;
  const next = photos[ni];
  if (next.type === 'video') {
    preloadVideo.src = next.url;
    preloadVideo.load();
  } else {
    preloadImg.src = next.url;
  }
}

function loadPhoto(i) {
  const p = photos[i];
  zoom = 1; panX = 0; panY = 0;

  if (p.type === 'video') {
    photoImg.style.display   = 'none';
    photoVideo.style.display = 'block';
    photoVideo.style.transition = 'none';
    photoVideo.src = p.url;
    photoVideo.muted = sessionMuted;
    btnMute.textContent = sessionMuted ? '🔇' : '🔊';
    videoControls.style.display = 'block';
    videoProgressBar.style.width = '0%';
    videoSpeedSlider.value = sessionPlaybackRate;
    videoSpeedLabel.textContent = sessionPlaybackRate + '×';
    photoVideo.addEventListener('canplay', () => {
      photoVideo.playbackRate = sessionPlaybackRate;
      photoVideo.muted = sessionMuted;
      photoVideo.play().catch(() => {
        // autoplay blocked — fall back to muted
        photoVideo.muted = true;
        sessionMuted = true;
        btnMute.textContent = '🔇';
        photoVideo.play().catch(() => {});
      });
    }, { once: true });
  } else {
    // Fully tear down the video so iOS releases the audio session and
    // background audio (e.g. Spotify) can resume once we're on a photo.
    photoVideo.pause();
    photoVideo.removeAttribute('src');
    photoVideo.load();
    photoVideo.style.display = 'none';
    videoControls.style.display = 'none';
    photoImg.style.display   = '';
    photoImg.style.transition = 'none';
    photoImg.src = p.url;
  }

  applyMediaTransform();
  requestAnimationFrame(() => {
    photoImg.style.transition   = '';
    photoVideo.style.transition = '';
  });
  photoContainer.style.transform = '';
  photoContainer.style.opacity   = '';
  decisionOverlay.className = '';
  decisionIcon.className    = '';
  decisionIcon.textContent  = '';
  delete decisionIcon.dataset.action;
  swiperCounter.textContent = `${i + 1} / ${photos.length}`;
  progressFill.style.width  = `${(i + 1) / photos.length * 100}%`;
  btnUndo.style.display     = decisionStack.length > 0 ? 'block' : 'none';
  updateThumbStrip(i);
  preloadNext(i);
}

document.getElementById('btn-rotate').addEventListener('click', () => {
  if (!photos.length) return;
  photos[index].rotation = (photos[index].rotation + 90) % 360;
  applyMediaTransform();
});

function navigateTo(i) {
  if (i < 0 || i >= photos.length) return;
  index = i;
  photoContainer.classList.remove('animating');
  loadPhoto(index);
}

function undo() {
  if (decisionStack.length === 0) return;
  hideEndOfStack();
  const lastDecided = decisionStack.pop();
  photos[lastDecided].decision = null;
  if (stripThumbs[lastDecided]) stripThumbs[lastDecided].style.display = '';
  index = lastDecided;
  photoContainer.classList.remove('animating');
  loadPhoto(index);
}

function todayFormatted() {
  const now = new Date();
  const dd = String(now.getDate()).padStart(2, '0');
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const yyyy = now.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function getMonthLabel() {
  if (!photos.length) return '';
  const counts = {};
  photos.forEach(p => {
    const [, mm, yyyy] = p.date.split('/');
    const key = `${yyyy}-${mm}`;
    counts[key] = (counts[key] || 0) + 1;
  });
  const [yyyy, mm] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0].split('-');
  return new Date(+yyyy, +mm - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}

async function saveSessionData() {
  const monthLabel = getMonthLabel();
  if (!monthLabel) return;
  const kept = photos.filter(p => p.decision === 'keep' || p.decision === 'album').slice(0, 3);
  const thumbnails = await Promise.all(kept.map(p => {
    if (p.type === 'video') return p.thumb ? Promise.resolve(p.thumb) : getVideoThumb(p.url).then(t => { p.thumb = t; return t; });
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const size = 80;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const min = Math.min(img.naturalWidth, img.naturalHeight);
          ctx.drawImage(img, (img.naturalWidth - min) / 2, (img.naturalHeight - min) / 2, min, min, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.65));
        } catch (_) { resolve(''); }
      };
      img.onerror = () => resolve('');
      img.src = p.url;
    });
  }));
  try {
    localStorage.setItem('lastSession', JSON.stringify({ monthLabel, thumbnails: thumbnails.filter(Boolean) }));
  } catch (_) {}
}

function decide(action) {
  const decidedIndex = index;
  photos[decidedIndex].decision = action;
  decisionStack.push(decidedIndex);
  if (stripThumbs[decidedIndex]) stripThumbs[decidedIndex].style.display = 'none';

  decisionOverlay.className = action;
  decisionIcon.dataset.action = action;
  decisionIcon.textContent = action === 'keep' ? '✓' : action === 'delete' ? '✕' : '★';
  decisionIcon.classList.add('show');

  photoContainer.classList.add('animating');
  if (action === 'album') {
    photoContainer.style.transform = 'translateY(-110vh)';
  } else {
    const dir = action === 'keep' ? -1 : 1;
    photoContainer.style.transform = `translateX(${dir * 110}vw)`;
  }
  photoContainer.style.opacity = '0';

  setTimeout(() => {
    photoContainer.classList.remove('animating');
    const next = findNext(decidedIndex);
    if (next !== -1) {
      index = next;
      loadPhoto(index);
    } else {
      const unsorted = photos.filter(p => p.decision === null);
      if (unsorted.length > 0) {
        index = photos.length;
        showEndOfStack(unsorted.length);
      } else {
        index = photos.length;
        showConfirm();
      }
    }
  }, 290);
}

// ── Touch / swipe / zoom / pan ───────────────────────────
let touchStartX = 0, touchStartY = 0;
let dragging = false;
let draggingUp = false;
let pinching = false, pinchStartDist = 0, pinchStartZoom = 1;
let panStartX = 0, panStartY = 0, panStartOffsetX = 0, panStartOffsetY = 0;

function pinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

const swiper = document.getElementById('screen-swiper');
let controlsTouch = false;

swiper.addEventListener('touchstart', (e) => {
  controlsTouch = !!e.target.closest('#video-controls');
  if (controlsTouch) return;
  if (e.touches.length === 2) {
    pinching = true;
    dragging = false;
    draggingUp = false;
    pinchStartDist = pinchDist(e.touches);
    pinchStartZoom = zoom;
    return;
  }
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  panStartX = e.touches[0].clientX;
  panStartY = e.touches[0].clientY;
  panStartOffsetX = panX;
  panStartOffsetY = panY;
  dragging = false;
  draggingUp = false;
}, { passive: true });

swiper.addEventListener('touchmove', (e) => {
  if (controlsTouch) return;
  if (e.touches.length === 2 && pinching) {
    const dist = pinchDist(e.touches);
    zoom = Math.min(5, Math.max(1, pinchStartZoom * dist / pinchStartDist));
    applyMediaTransform();
    return;
  }
  if (zoom > 1) {
    // pan mode
    panX = panStartOffsetX + (e.touches[0].clientX - panStartX);
    panY = panStartOffsetY + (e.touches[0].clientY - panStartY);
    applyMediaTransform();
    return;
  }
  // swipe mode
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!dragging && !draggingUp && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) dragging = true;
  if (!dragging && !draggingUp && dy < -8 && Math.abs(dy) > Math.abs(dx)) draggingUp = true;
  if (dragging) {
    photoContainer.style.transform = `translateX(${dx}px) rotate(${dx * 0.02}deg)`;
    const ratio = Math.min(Math.abs(dx) / 80, 1);
    const action = dx < 0 ? 'delete' : 'keep';
    decisionOverlay.className = action;
    decisionOverlay.style.opacity = String(ratio * 0.8);
    decisionIcon.dataset.action = action;
    decisionIcon.textContent = dx < 0 ? '✕' : '✓';
    decisionIcon.classList.toggle('show', ratio > 0.4);
  }
  if (draggingUp) {
    photoContainer.style.transform = `translateY(${Math.min(0, dy)}px)`;
    const ratio = Math.min(Math.abs(dy) / 80, 1);
    decisionOverlay.className = 'album';
    decisionOverlay.style.opacity = String(ratio * 0.8);
    decisionIcon.dataset.action = 'album';
    decisionIcon.textContent = '★';
    decisionIcon.classList.toggle('show', ratio > 0.4);
  }
}, { passive: true });

swiper.addEventListener('touchend', (e) => {
  if (controlsTouch) { controlsTouch = false; return; }
  if (pinching) {
    pinching = false;
    dragging = false;
    draggingUp = false;
    if (zoom < 1.05) resetZoom();
    return;
  }

  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  if (!dragging && !draggingUp && zoom === 1) {
    const stripTop = thumbStrip.getBoundingClientRect().top;
    if (touch.clientY >= stripTop) return; // tap in thumb strip — handled by strip scrub
    const W = window.innerWidth;
    if (touch.clientX < W / 3) { const p = findPrev(index); if (p !== -1) navigateTo(p); }
    else if (touch.clientX > W * 2 / 3) { const n = findNext(index); if (n !== -1) navigateTo(n); }
    return;
  }

  if (zoom > 1) return; // end pan — keep position

  if (draggingUp) {
    draggingUp = false;
    if (dy < -50) {
      decisionOverlay.style.opacity = '';
      decide('album');
    } else {
      photoContainer.classList.add('animating');
      photoContainer.style.transform = '';
      photoContainer.style.opacity = '';
      decisionOverlay.className = '';
      decisionOverlay.style.opacity = '';
      decisionIcon.className = '';
      delete decisionIcon.dataset.action;
      setTimeout(() => photoContainer.classList.remove('animating'), 290);
    }
    return;
  }

  if (dragging && Math.abs(dx) > 50) {
    decisionOverlay.style.opacity = '';
    if (dx < 0) decide('delete');
    else decide('keep');
    return;
  }

  if (dragging) {
    photoContainer.classList.add('animating');
    photoContainer.style.transform = '';
    photoContainer.style.opacity = '';
    decisionOverlay.className = '';
    decisionOverlay.style.opacity = '';
    decisionIcon.className = '';
    delete decisionIcon.dataset.action;
    setTimeout(() => photoContainer.classList.remove('animating'), 290);
  }
}, { passive: true });

// ── Keyboard (desktop testing) ─────────────────────────
document.addEventListener('keydown', (e) => {
  if (!screens.swiper.classList.contains('active')) return;
  if (e.key === 'ArrowLeft')  decide('delete');
  if (e.key === 'ArrowRight') decide('keep');
  if (e.key === 'ArrowUp')    decide('album');
  if (e.key === 'Backspace' || e.key === 'z') undo();
});

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-stop').addEventListener('click', showConfirm);

// ── End of stack ────────────────────────────────────────
const endOfStack = document.getElementById('end-of-stack');

function showEndOfStack(unsortedCount) {
  const n = unsortedCount;
  document.getElementById('eos-message').textContent =
    `You've reached the end, but ${n} photo${n !== 1 ? 's' : ''} haven't been sorted yet.`;
  endOfStack.classList.add('active');
}

function hideEndOfStack() {
  endOfStack.classList.remove('active');
}

document.getElementById('btn-show-unsorted').addEventListener('click', () => {
  hideEndOfStack();
  const i = photos.findIndex(p => p.decision === null);
  if (i !== -1) navigateTo(i);
});

document.getElementById('btn-eos-done').addEventListener('click', () => {
  hideEndOfStack();
  showConfirm();
});

// ── Hint arrows ─────────────────────────────────────────
function showHints() {
  hintLeft.classList.add('visible');
  hintRight.classList.add('visible');
}

// ── Confirm screen ──────────────────────────────────────
function showConfirm() {
  showScreen('confirm');
  saveSessionData();

  const toDelete = photos.filter(p => p.decision === 'delete');
  const toAlbum  = photos.filter(p => p.decision === 'album');
  const kept = photos.length - toDelete.length - toAlbum.length;

  confirmTitle.textContent = `Delete ${toDelete.length} photo${toDelete.length !== 1 ? 's' : ''}?`;
  document.getElementById('stat-kept').textContent  = kept;
  document.getElementById('stat-del').textContent   = toDelete.length;
  document.getElementById('stat-album').textContent = toAlbum.length;
  const albumTile = document.getElementById('stat-album-tile');
  albumTile.style.display = toAlbum.length > 0 ? '' : 'none';

  function buildThumbItem(p, badgeText, badgeColor) {
    const div = document.createElement('div');
    div.className = 'thumb-item';
    const img = document.createElement('img');
    img.alt = p.name;
    if (p.type === 'video') {
      if (p.thumb) { img.src = p.thumb; }
      else { getVideoThumb(p.url).then(t => { p.thumb = t; img.src = t; }); }
    } else {
      img.src = p.url;
    }
    const badge = document.createElement('div');
    badge.className = 'thumb-badge';
    badge.textContent = badgeText;
    if (badgeColor) badge.style.background = badgeColor;
    div.appendChild(img);
    div.appendChild(badge);
    if (p.type === 'video') {
      const vbadge = document.createElement('div');
      vbadge.className = 'thumb-video-badge';
      vbadge.textContent = '▶';
      div.appendChild(vbadge);
    }
    return div;
  }

  thumbGrid.innerHTML = '';
  if (toDelete.length === 0) {
    thumbGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No photos marked for deletion 🎉</div>';
    btnDelete.style.display = 'none';
  } else {
    btnDelete.style.display = '';
    toDelete.forEach(p => thumbGrid.appendChild(buildThumbItem(p, '✕', null)));
  }

  const albumSection = document.getElementById('album-section');
  const albumGrid    = document.getElementById('album-grid');
  albumGrid.innerHTML = '';
  if (toAlbum.length > 0) {
    albumSection.style.display = '';
    toAlbum.forEach(p => albumGrid.appendChild(buildThumbItem(p, '★', 'var(--album)')));
  } else {
    albumSection.style.display = 'none';
  }
}

// ── Delete / Album via Shortcuts ────────────────────────
function buildInput() {
  return photos.filter(p => p.decision === 'delete').map(p => `${p.name}|${p.date}`).join(',');
}

function buildAlbumInput() {
  return photos.filter(p => p.decision === 'album').map(p => `${p.name}|${p.date}`).join(',');
}

document.getElementById('btn-album-shortcut').addEventListener('click', () => {
  const input = buildAlbumInput();
  if (!input) return;
  const url = 'shortcuts://run-shortcut?name=Add%20Photos%20To%20Album%20From%20Text&input=' + encodeURIComponent(input);
  window.location.href = url;
});

const btnCopyAlbum = document.getElementById('btn-copy-album');
const debugAlbumString = document.getElementById('debug-album-string');
btnCopyAlbum.addEventListener('click', () => {
  const input = buildAlbumInput();
  debugAlbumString.textContent = input;
  debugAlbumString.style.display = 'block';
  navigator.clipboard.writeText(input).then(() => {
    btnCopyAlbum.textContent = 'Copied!';
    setTimeout(() => { btnCopyAlbum.textContent = 'Copy album list'; }, 2000);
  }).catch(() => {
    btnCopyAlbum.textContent = 'See string below';
  });
});

btnDelete.addEventListener('click', () => {
  const input = buildInput();
  if (!input) return;
  const url = 'shortcuts://run-shortcut?name=Delete%20Photos%20From%20Text&input=' + encodeURIComponent(input);
  window.location.href = url;
});

const btnCopy = document.getElementById('btn-copy');
const debugString = document.getElementById('debug-string');
btnCopy.addEventListener('click', () => {
  const input = buildInput();
  debugString.textContent = input;
  debugString.style.display = 'block';
  navigator.clipboard.writeText(input).then(() => {
    btnCopy.textContent = 'Copied!';
    setTimeout(() => { btnCopy.textContent = 'Copy input string'; }, 2000);
  }).catch(() => {
    btnCopy.textContent = 'See string below';
  });
});

// ── Restart swiping (same photos, reset decisions) ──────
document.getElementById('btn-reswipe').addEventListener('click', () => {
  photos.forEach(p => { p.decision = null; });
  index = 0;
  decisionStack = [];
  hideEndOfStack();
  showScreen('swiper');
  populateThumbStrip();
  loadPhoto(0);
  showHints();
});

// ── Select new photos ────────────────────────────────────
btnRestart.addEventListener('click', () => {
  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  index = 0;
  showScreen('landing');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/photo-curator/sw.js');
}
</script>
</body>
